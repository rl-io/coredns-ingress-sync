name: 'Run Go Tests with Kubernetes'
description: 'Runs comprehensive Go tests including integration and E2E tests'
inputs:
  go_version:
    description: 'Go version to use'
    required: false
    default: '1.26'
  run_integration_tests:
    description: 'Whether to run integration tests'
    required: false
    default: 'true'
  run_e2e_tests:
    description: 'Whether to run E2E tests'
    required: false
    default: 'true'
  codecov_token:
    description: 'Codecov token for coverage upload'
    required: false
  image_artifact_path:
    description: 'Path to Docker image artifact'
    required: false
    default: '/tmp'
  cluster_timeout:
    description: 'Timeout for cluster operations (seconds)'
    required: false
    default: '120'
  kind_version:
    description: 'kind binary version to install (e.g. v0.32.0)'
    required: false
    default: 'v0.26.0'
  node_image:
    description: 'kindest/node image to boot (e.g. kindest/node:v1.35.5@sha256:...). Empty uses the kind default for the chosen kind_version.'
    required: false
    default: ''
  artifact_suffix:
    description: 'Suffix appended to uploaded artifact names so parallel matrix jobs do not collide.'
    required: false
    default: ''

outputs:
  test_status:
    description: 'Overall test status (success/failure)'
    value: ${{ steps.test_summary.outputs.status }}
  coverage_percentage:
    description: 'Test coverage percentage'
    value: ${{ steps.coverage.outputs.percentage }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go_version }}
        cache: true
          
    - name: Set up Go module permissions
      shell: bash
      run: |
        if [ -d ~/go/pkg/mod ]; then
          chmod -R u+w ~/go/pkg/mod || true
        fi
          
    - name: Download dependencies
      shell: bash
      run: |
        echo "::group::📦 Downloading Go Dependencies"
        go mod download
        go mod verify
        echo "::endgroup::"
      
    - name: Run unit tests
      shell: bash
      run: |
        echo "::group::🧪 Running Unit Tests"
        LOG_LEVEL=debug go test -v -race -coverprofile=coverage.out ./...
        echo "::endgroup::"
      
    - name: Generate coverage report
      id: coverage
      shell: bash
      run: |
        echo "::group::📊 Generating Coverage Report"
        go tool cover -html=coverage.out -o coverage.html
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE%"
        echo "::endgroup::"
      
    - name: Upload coverage to Codecov
      if: inputs.codecov_token != ''
      uses: codecov/codecov-action@v7
      with:
        flags: unittests
        name: codecov-umbrella
        slug: rl-io/coredns-ingress-sync
        token: ${{ inputs.codecov_token }}
        fail_ci_if_error: false
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports${{ inputs.artifact_suffix }}
        path: |
          coverage.out
          coverage.html
          
    - name: Load Docker image for testing
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::🐳 Loading Docker Image"
        if [ -f "${{ inputs.image_artifact_path }}/image.tar" ]; then
          echo "Loading Docker image from artifact..."
          docker load -i "${{ inputs.image_artifact_path }}/image.tar"
          docker tag coredns-ingress-sync:test coredns-ingress-sync:latest
        else
          echo "No image artifact found, building for tests..."
          docker build -t coredns-ingress-sync:latest .
        fi
        echo "::endgroup::"
          
    - name: Set up Kind cluster
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::⚙️ Setting up Kind Cluster Configuration"
        cat > kind-config.yaml << 'EOF'
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          kubeadmConfigPatches:
          - |
            kind: InitConfiguration
            nodeRegistration:
              kubeletExtraArgs:
                node-labels: "ingress-ready=true"
          extraPortMappings:
          - containerPort: 80
            hostPort: 8080
            protocol: TCP
          - containerPort: 443
            hostPort: 8443
            protocol: TCP
        EOF
        echo "::endgroup::"
        
    - name: Create Kind cluster
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      uses: helm/kind-action@v1.14.0
      with:
        cluster_name: test-cluster
        config: kind-config.yaml
        version: ${{ inputs.kind_version }}
        node_image: ${{ inputs.node_image }}
              
    - name: Load image into Kind cluster
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::📥 Loading Image into Kind Cluster"
        kind load docker-image coredns-ingress-sync:latest --name test-cluster
        echo "::endgroup::"
        
    - name: Install nginx-ingress
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::🌐 Installing NGINX Ingress Controller"
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
        kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=${{ inputs.cluster_timeout }}s
        echo "::endgroup::"
        
    - name: Install Helm
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      uses: azure/setup-helm@v5
      with:
        version: v3.12.0

    - name: Install Gateway API CRDs
      if: inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::🌐 Installing Gateway API CRDs"
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
        kubectl wait --for=condition=established --timeout=60s \
          crd/gatewayclasses.gateway.networking.k8s.io \
          crd/gateways.gateway.networking.k8s.io \
          crd/httproutes.gateway.networking.k8s.io
        echo "::endgroup::"

    - name: Install Traefik (Gateway API provider)
      if: inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::🌐 Installing Traefik"
        helm repo add traefik https://traefik.github.io/charts
        helm repo update traefik
        # Traefik's chart defaults its Service to type LoadBalancer, and
        # `helm install --wait` blocks until that Service has an external IP.
        # Plain Kind has no LoadBalancer provisioner (no MetalLB /
        # cloud-provider-kind), so that IP never arrives and --wait hangs for
        # the full timeout on every run. CIS only ever targets the ClusterIP
        # anyway, so force that instead -- --wait then just waits on the
        # Deployment's pod readiness, which is fast.
        if ! helm install traefik traefik/traefik \
          --namespace traefik --create-namespace \
          --set providers.kubernetesGateway.enabled=true \
          --set gateway.enabled=false \
          --set service.spec.type=ClusterIP \
          --wait --timeout=120s; then

          echo "::group::🔧 Traefik install failed, gathering debug information"
          kubectl get pods -n traefik -o wide || true
          kubectl describe pods -n traefik || true
          kubectl get events -n traefik --sort-by='.lastTimestamp' || true
          echo "::endgroup::"

          exit 1
        fi
        kubectl wait --namespace traefik --for=condition=available --timeout=60s deployment/traefik
        echo "::endgroup::"

    - name: Deploy controller for testing
      if: inputs.run_integration_tests == 'true' || inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::🚀 Deploying Controller for Testing"
        if ! helm upgrade --install coredns-ingress-sync \
          ./helm/coredns-ingress-sync \
          --namespace coredns-ingress-sync \
          --create-namespace \
          --wait \
          --timeout 90s \
          --values ./helm/coredns-ingress-sync/values-test.yaml; then
          
          echo "::group::🔧 Deployment failed, gathering debug information"
          echo "Checking for preflight job logs..."
          chmod +x scripts/debug-preflight.sh
          ./scripts/debug-preflight.sh || echo "Could not get preflight logs"
          
          echo "Checking namespace status..."
          kubectl get all -n coredns-ingress-sync || echo "Could not get namespace status"
          
          echo "Checking cluster events..."
          kubectl get events -n coredns-ingress-sync --sort-by='.lastTimestamp' || echo "Could not get events"
          echo "::endgroup::"
          
          exit 1
        fi
        
        kubectl wait --for=condition=available --timeout=60s deployment/coredns-ingress-sync -n coredns-ingress-sync
        echo "::endgroup::"
        
    - name: Run integration tests
      if: inputs.run_integration_tests == 'true'
      shell: bash
      run: |
        echo "::group::🔗 Running Integration Tests"
        export KUBECONFIG=$HOME/.kube/config
        chmod +x tests/run_tests.sh
        ./tests/run_tests.sh --integration
        echo "::endgroup::"
        
    - name: Run E2E tests
      if: inputs.run_e2e_tests == 'true'
      shell: bash
      run: |
        echo "::group::🎯 Running E2E Tests"
        export KUBECONFIG=$HOME/.kube/config
        ./tests/run_tests.sh --e2e
        echo "::endgroup::"
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results${{ inputs.artifact_suffix }}
        path: test_results/
        
    - name: Test summary
      id: test_summary
      if: always()
      shell: bash
      run: |
        echo "::group::📋 Test Summary"
        if [ "${{ job.status }}" = "success" ]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ All Tests Passed"
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "❌ Some Tests Failed"
        fi
        echo "::endgroup::"
